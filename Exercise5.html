<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color + Margin + Background – Practice</title>

  <style>
    body {
      /* ────────────── TO DO 1 ────────────── */
      /* Set a background color or simple gradient for the whole page */
      background: linear-gradient(to right, rgb(194, 157, 244), rgb(115, 51, 225));
      min-height: 100vh;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .container {
      /* ────────────── TO DO 2 ────────────── */
      /* 
        - Use margin to create space between cards
        - You can use flexbox or just margin – both are okay
      */
      display:flex;
      flex-wrap: wrap;
      gap: 45px;
      max-width: 1100px;
    }

    .card {
      width: 240px;
      min-height: 280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);

      /* ────────────── TO DO 3 ────────────── */
      /* Give each card a different background color */
      background-color: rgb(92, 69, 244);
      
      /* You can also try: 
         background: linear-gradient(to bottom, #......, #......);
      */
    }
    .card2 {
        width: 400px;
        height: 200px;
        gap: 20px;
        border: 8px solid: slategray;
        margin: 30px;
        box-sizing: border-box;

    }
    /* You may add more classes below ↓↓↓ */

    .card:nth-child(1) { background: rgb(233, 132, 78); }
    .card:nth-child(2) { background: rgb(119, 184, 148); }
    .card:nth-child(3) { background: rgb(110, 210, 225); }
    .card:nth-child(4) { background: rgb(255, 94, 156); }

    .card-content {
      padding: 24px 20px;
      color: white;
      text-align: center;
    }
    
    h2 {
      margin: 0 0 16px 0;
      font-size: 1.4rem;
    }

    p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.9;
    }

    /* Optional bonus: hover effect */
    .card:hover {
      transform: translateY(-8px);
      transition: transform 0.25s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="card-content">
        <h2>Summer</h2>
        <p>Warm days, cold drinks, long evenings</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Forest</h2>
        <p>Green, calm, moss and mystery</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Ocean</h2>
        <p>Deep blue, waves, freedom</p>
      </div>
    </div>

    <div class="card">
      <div class="card-content">
        <h2>Sunset</h2>
        <p>Orange, pink, magic hour</p>
      </div>
    </div>
  </div>

</body>
</html>
